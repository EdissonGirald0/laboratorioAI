
networks:
  laboratorio_ai:
    name: laboratorio_ai
    driver: bridge

services:

  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - laboratorio_ai
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    restart: always
    container_name: laboratorioai-postgres
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    command: >
      sh -c "
        docker-entrypoint.sh postgres &
        POSTGRES_PID=\$!;
        until pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 2; done;
        echo 'Verificando n8n_db...';
        if ! psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_database WHERE datname='n8n_db'\" | grep -q 1; then
          echo 'Creando n8n_db...';
          psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'CREATE DATABASE n8n_db;';
        else
          echo 'n8n_db ya existe';
        fi;
        wait \$$POSTGRES_PID
      "
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laboratorio_ai
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    env_file:
      - .env
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - laboratorio_ai
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - laboratorio_ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pull_policy: always

  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/openwebui.db
      - REDIS_URL=redis://redis:6379/0?password=${REDIS_PASSWORD}
      - OLLAMA_API_BASE_URL=http://host.docker.internal:11434/api
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
    ports:
      - "8080:8080"
    volumes:
      - openwebui_data:/app/data
    depends_on:
      - ollama
    networks:
      - laboratorio_ai
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Configuración básica
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PATH=${N8N_PATH:-/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_ENV=production
      
      # Configuración de base de datos PostgreSQL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      
      # Configuración de Redis
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Configuración de seguridad
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST}
      - N8N_SMTP_PORT=${SMTP_PORT}
      - N8N_SMTP_USER=${SMTP_USER}
      - N8N_SMTP_PASS=${SMTP_PASSWORD}
      
      # Configuración de workflows
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=7200
      - N8N_DEFAULT_WORKFLOW_NAME=AI Lab Workflow
      - GENERIC_TIMEZONE=UTC
      
      # Configuración de logging
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=file
      - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs
      
      # Configuración avanzada
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_DIAGNOSTICS_CONFIG_ENABLED=false
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_PUBLIC_API_SAME_USER_ALLOWED=true
      - N8N_PUSH_BACKEND_DISABLED=true
      - N8N_METRICS=true
      
      # Variables personalizadas para integración
      - N8N_FLOOWISE_URL=http://floowise:3000
      - N8N_FLOOWISE_API_KEY=${FLOWISE_API_KEY}
      - N8N_OLLAMA_URL=http://ollama:11434
      - N8N_QDRANT_URL=http://qdrant:6333
      - N8N_QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
      - ./n8n/custom:/home/node/.n8n/custom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - laboratorio_ai
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    extra_hosts:
      - "host.docker.internal:host-gateway"

  floowise:
    build: ./floowise
    container_name: floowise
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - FLOWISE_USERNAME=${FLOWISE_USERNAME}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      - DATABASE_TYPE=postgres
      - DATABASE_PORT=5432
      - DATABASE_HOST=postgres
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_SCHEMA=public
      - FLOWISE_ENTERPRISE_ENABLED=false
      - SKIP_ENTERPRISE_MIGRATIONS=true
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_API_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - EXECUTION_MODE=main
      - DEBUG=true
      - LOG_LEVEL=info
      - TOOL_FUNCTION_BUILTIN_DEP=crypto,fs,path
      - TOOL_FUNCTION_EXTERNAL_DEP=axios,moment
      - CREDENTIAL_JSON=${CREDENTIAL_JSON}
      - APIKEY_PATH=/root/.flowise/.apikeys
      - SECRETKEY_PATH=/root/.flowise/.secrets
    ports:
      - "3000:3000"
    volumes:
      - floowise_data:/root/.flowise
      - ./floowise/components:/root/.flowise/components
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laboratorio_ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  ollama_data:
  n8n_data:
  floowise_data:
  openwebui_data: